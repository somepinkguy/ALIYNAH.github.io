<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Countdown</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
    }

    #countdown {
      font-size: 40px;
      font-weight: bold;
      margin-top: 20px;
    }

    #secret {
      display: none; /* Hidden at start */
      margin-top: 40px;
      font-size: 35px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

<h1>Countdown</h1>

<div id="countdown">Loading...</div>

<!-- This is the secret message shown AFTER countdown ends -->
<div id="secret">🎉 The countdown is finished! 🎉</div>

<script>
// SET YOUR TARGET DATE HERE ↓↓↓
const targetDate = new Date("2025-7-12T00:00:00").getTime();
// ↑↑↑ Example: January 1st, 2025

function update() {
  const now = Date.now();
  let remaining = targetDate - now;

  if (remaining <= 0) {
    document.getElementById("countdown").innerText = "DONE!";
    document.getElementById("secret").style.display = "block"; // Show message
    return;
  }

  const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
  remaining %= (1000 * 60 * 60 * 24);

  const hours = Math.floor(remaining / (1000 * 60 * 60));
  remaining %= (1000 * 60 * 60);

  const minutes = Math.floor(remaining / (1000 * 60));
  remaining %= (1000 * 60);

  const seconds = Math.floor(remaining / 1000);

  document.getElementById("countdown").innerText =
    `${days}d ${hours}h ${minutes}m ${seconds}s`;

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
